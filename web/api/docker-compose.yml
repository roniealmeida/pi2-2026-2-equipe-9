services:
  api:
    build: .
    container_name: plant-analysis-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,::1,*"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000,http://0.0.0.0:8000"
      MEDIA_URL: "/media/"
      MEDIA_ROOT: "/app/media"
      MEDIA_BASE_URL: ""
    volumes:
      - ./media:/app/media
    restart: unless-stopped
