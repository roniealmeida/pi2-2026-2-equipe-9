services:
  web:
    image: node:20-slim
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: "${VITE_API_URL}"
