version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: plant-analysis-api

    ports:
      - "8000:8000"

    env_file:
      - ./api/.env

    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      MEDIA_URL: "/media/"
      MEDIA_ROOT: "/app/media"
      MEDIA_BASE_URL: ""

    volumes:
      - ./api/media:/app/media

    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile

    container_name: plant-analysis-web

    ports:
      - "5173:5173"

    depends_on:
      - api

    volumes:
      - ./web:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    restart: unless-stopped