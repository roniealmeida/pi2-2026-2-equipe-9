version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: plant-analysis-db
    environment:
      POSTGRES_DB: analisaai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: plant-analysis-api

    ports:
      - "8000:8000"

    env_file:
      - ./api/.env

    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      MEDIA_URL: "/media/"
      MEDIA_ROOT: "/app/media"
      MEDIA_BASE_URL: ""
      DB_NAME: "analisaai"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_SSL: "disable"

    volumes:
      - ./api/media:/app/media
      - ./seed.sql:/app/seed.sql

    depends_on:
      - db

    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile

    container_name: plant-analysis-web

    ports:
      - "5173:5173"

    depends_on:
      - api

    volumes:
      - ./web:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"

    restart: unless-stopped

volumes:
  postgres_data: